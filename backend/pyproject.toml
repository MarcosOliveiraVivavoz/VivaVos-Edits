[project]
name = "vivavoz-corte-backend"
version = "0.1.0"
description = "Backend HTTP de corte e enquadramento 9:16 para o pipeline de edição VivaVoz/Orquestra."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "opencv-python-headless>=4.9",
    "mediapipe==0.10.14",  # última com a API legada `solutions.face_detection` que este código usa
    "numpy>=1.26",
]

[project.optional-dependencies]
# Detecção de microfone (ancoragem de borda no enquadramento) via YOLO-World.
# Pesada (~58MB de checkpoint + torch) e opcional: sem ela, /enquadramento
# degrada graciosamente para o crop baseado só em rosto.
mic = ["ultralytics>=8.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
